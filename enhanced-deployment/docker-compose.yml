version: '3.8'

services:
  # MySQL Database
  mysql:
    image: mysql:8.0
    container_name: telepath_mysql
    environment:
      MYSQL_ROOT_PASSWORD: root_password
      MYSQL_DATABASE: telepath_catalog
      MYSQL_USER: catalog_user
      MYSQL_PASSWORD: catalog_pass
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./database/migration.sql:/docker-entrypoint-initdb.d/01-schema.sql
      - ./database/sample_data.sql:/docker-entrypoint-initdb.d/02-data.sql
    command: >
      --default-authentication-plugin=mysql_native_password
      --sql_mode=STRICT_TRANS_TABLES,NO_ZERO_DATE,NO_ZERO_IN_DATE,ERROR_FOR_DIVISION_BY_ZERO
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "catalog_user", "-pcatalog_pass"]
      timeout: 20s
      retries: 10
      interval: 10s
      start_period: 30s
    networks:
      - telepath_network

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: telepath_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - telepath_network

  # Catalog Manager API
  catalog-manager:
    build:
      context: ./catalog-manager
      dockerfile: Dockerfile
    container_name: telepath_catalog_manager
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USER: catalog_user
      DB_PASSWORD: catalog_pass
      DB_NAME: telepath_catalog
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_DB: 0
      FLASK_ENV: development
      FLASK_DEBUG: "1"
    ports:
      - "8080:8080"
    volumes:
      - ./catalog-manager:/app
      - ./logs:/app/logs
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/admin/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    restart: unless-stopped
    networks:
      - telepath_network

  # Enhanced MCP Server
  mcp-server:
    build:
      context: ./mcp-server
      dockerfile: Dockerfile
    container_name: telepath_mcp_server
    environment:
      CATALOG_MANAGER_URL: http://catalog-manager:8080
      LOG_LEVEL: INFO
      MCP_SERVER_NAME: telepath-enhanced
    ports:
      - "8081:8081"
    volumes:
      - ./mcp-server:/app
      - ./logs:/app/logs
    depends_on:
      catalog-manager:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import requests; requests.get('http://localhost:8081/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    restart: unless-stopped
    networks:
      - telepath_network

  # Web UI (Optional - for demo/testing)
  web-ui:
    image: nginx:alpine
    container_name: telepath_web_ui
    ports:
      - "8082:80"
    volumes:
      - ./web-ui:/usr/share/nginx/html
      - ./web-ui/nginx.conf:/etc/nginx/nginx.conf
    depends_on:
      - catalog-manager
      - mcp-server
    networks:
      - telepath_network

  # Monitoring and Logging (Optional)
  prometheus:
    image: prom/prometheus:latest
    container_name: telepath_prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
    networks:
      - telepath_network

  grafana:
    image: grafana/grafana:latest
    container_name: telepath_grafana
    ports:
      - "3000:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/dashboards:/etc/grafana/provisioning/dashboards
      - ./monitoring/grafana/datasources:/etc/grafana/provisioning/datasources
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin
    depends_on:
      - prometheus
    networks:
      - telepath_network

volumes:
  mysql_data:
    driver: local
  redis_data:
    driver: local
  prometheus_data:
    driver: local
  grafana_data:
    driver: local

networks:
  telepath_network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16